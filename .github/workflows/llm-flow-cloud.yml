name: LLM Flow Cloud Search

on:
  workflow_dispatch:
    inputs:
      candidates_per_repeat:
        description: Candidates tested per design per repeat
        required: true
        default: "64"
      repeats:
        description: Number of independent LLM search repeats
        required: true
        default: "3"
      batch_size:
        description: Candidates requested per LLM call
        required: true
        default: "8"
      temperature:
        description: LLM temperature
        required: true
        default: "0.2"

permissions:
  contents: write

env:
  LLM_MODEL: deepseek-v4-flash
  LLM_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        design: [bfly, dscg, fir, ode, or1200, syn2]
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Check API key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Missing repository secret DEEPSEEK_API_KEY"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libreadline-dev flex bison

      - name: Clone official FlowTune
        run: git clone --depth 1 https://github.com/Yu-Maryland/FlowTune.git official-flowtune

      - name: Build ABC
        run: |
          mkdir -p official-flowtune/src/build
          cd official-flowtune/src/build
          cmake .. -DCMAKE_C_FLAGS="-fcommon -w" \
            -DCMAKE_CXX_FLAGS="-fcommon -w -std=c++11"
          make -j"$(nproc)"

      - name: Run LLM search
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 llm-flow/controller.py \
            --abc "$GITHUB_WORKSPACE/official-flowtune/src/build/abc" \
            --benchmark "$GITHUB_WORKSPACE/official-flowtune/Benchmarks/BLIF/${{ matrix.design }}.abc.blif" \
            --design "${{ matrix.design }}" \
            --output-dir "$GITHUB_WORKSPACE/llm-flow-output/${{ matrix.design }}" \
            --candidates-per-repeat "${{ inputs.candidates_per_repeat }}" \
            --repeats "${{ inputs.repeats }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --temperature "${{ inputs.temperature }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-flow-${{ matrix.design }}
          path: llm-flow-output/${{ matrix.design }}
          if-no-files-found: warn

  report:
    needs: search
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: llm-flow-*
          path: downloaded

      - name: Aggregate results
        run: |
          python3 llm-flow/aggregate.py \
            "$GITHUB_WORKSPACE/downloaded" \
            "$GITHUB_WORKSPACE/llm-flow-results/latest"

      - name: Commit results
        run: |
          git config user.name "llm-flow-runner"
          git config user.email "actions@users.noreply.github.com"
          git add llm-flow-results/latest
          git commit -m "LLM flow cloud search results" || echo "No changes"
          git push || echo "Push failed"
