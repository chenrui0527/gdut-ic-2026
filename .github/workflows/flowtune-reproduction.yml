name: FlowTune 论文复现（网表 + 逻辑门数量 + 网表深度）

# 按高鹏老师批注要求：
#   1) 得到逻辑综合的网表
#   2) 比较逻辑门的数量和网表的深度 (depth)
#   3) 先不用跑布线
#
# 本工作流在云端 Ubuntu 上完整跑一遍，把每一步的原始输出、网表文件、
# 汇总表格全部提交回仓库，任何人可以复查。

on:
  push:
    paths:
      - '.github/workflows/flowtune-reproduction.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  DESIGN: bfly.abc.blif
  # 搜索配置。论文用的是更大的配置，这里为控制 CI 时长取较小的一组，
  # 具体数值全部写在报告里，不隐瞒。
  REPEAT: "1"
  ITER: "5"
  SAMPLE: "5"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: 拉取本仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libreadline-dev flex bison

      - name: 克隆作者官方仓库
        run: git clone --depth 1 https://github.com/Yu-Maryland/FlowTune.git official-flowtune

      - name: 编译 FlowTune 版 ABC
        run: |
          set -x
          mkdir -p official-flowtune/src/build
          cd official-flowtune/src/build
          cmake .. -DCMAKE_C_FLAGS="-fcommon -w" -DCMAKE_CXX_FLAGS="-fcommon -w -std=c++11" > build.log 2>&1
          make -j"$(nproc)" >> build.log 2>&1
          ls -l abc

      - name: 修复 abc 与 abc.rc 两个软链接（Windows 签出会变成普通文本文件）
        run: |
          set -x
          cd official-flowtune/FlowTune-AIG-Optimization
          # 这两个文件在本仓库里原本是 Linux 软链接，内容分别是 "../abc" 和 "../abc.rc"。
          # git 在 Windows 上把它们签出成了文本文件，导致 abc 无法执行、
          # abc.rc 被当成命令执行并报 "unknown command 'ps'"。
          # 这里改成放真文件，从根上解决。
          rm -f abc abc.rc
          cp ../src/build/abc ./abc
          cp ../abc.rc ./abc.rc
          chmod +x ./abc
          echo "abc  大小: $(stat -c%s abc) 字节"
          echo "abc.rc 大小: $(stat -c%s abc.rc) 字节"
          echo "--- 验证 abc.rc 已被正确加载（应无 unknown command 'ps'）---"
          ./abc -c "read ../Benchmarks/BLIF/bfly.abc.blif; ps" | tail -5

      - name: 准备基准设计与结果目录
        run: |
          set -e
          cd official-flowtune/FlowTune-AIG-Optimization
          cp ../Benchmarks/BLIF/${DESIGN} .
          ls -l ${DESIGN}
          mkdir -p "$GITHUB_WORKSPACE/flowtune-reproduction/netlists"
          mkdir -p "$GITHUB_WORKSPACE/flowtune-reproduction/raw"
          echo "OUT=$GITHUB_WORKSPACE/flowtune-reproduction" >> "$GITHUB_ENV"

      - name: 基线一：ABC 默认综合流程 resyn
        continue-on-error: true
        run: |
          cd official-flowtune/FlowTune-AIG-Optimization
          timeout 900 ./abc -c "read ${DESIGN}; resyn; strash; print_stats; write baseline_resyn.aig" \
            > "$OUT/raw/baseline_resyn.log" 2>&1 || echo "基线一超时或失败" | tee -a "$OUT/raw/baseline_resyn.log"
          tail -6 "$OUT/raw/baseline_resyn.log" || true

      - name: 基线二：resyn 连续 25 次（作者 README 用的基线）
        continue-on-error: true
        run: |
          cd official-flowtune/FlowTune-AIG-Optimization
          CMD="read ${DESIGN}"; for i in $(seq 1 25); do CMD="$CMD; resyn"; done
          timeout 1800 ./abc -c "$CMD; strash; print_stats; write baseline_resyn25.aig" \
            > "$OUT/raw/baseline_resyn25.log" 2>&1 || echo "基线二超时或失败" | tee -a "$OUT/raw/baseline_resyn25.log"
          tail -6 "$OUT/raw/baseline_resyn25.log" || true

      - name: FlowTune 目标 t=0（最小化逻辑门数量）
        continue-on-error: true
        run: |
          cd official-flowtune/FlowTune-AIG-Optimization
          echo "ftune -d ${DESIGN} -r ${REPEAT} -t 0 -p 1 -i ${ITER} -s ${SAMPLE}" | ./abc \
            > "$OUT/raw/ftune_t0_search.log" 2>&1 || true
          # ftune 把候选流程写进 <输入文件>.script，文件名在不同版本里略有差别，这里做兼容
          FLOW="${DESIGN}.script"
          [ -f "$FLOW" ] || FLOW="$(ls -t *.script 2>/dev/null | head -1)"
          echo "流程文件：$FLOW"
          cp "$FLOW" "$OUT/raw/ftune_t0_best_flows.txt" 2>/dev/null || true
          head -1 "$FLOW" > chosen_t0.script 2>/dev/null || true
          echo "--- 选中的流程 ---"; cat chosen_t0.script || true
          timeout 900 ./abc -c "read ${DESIGN}; source chosen_t0.script; strash; print_stats; write flowtune_t0.aig" \
            > "$OUT/raw/ftune_t0_apply.log" 2>&1 || echo "应用超时" | tee -a "$OUT/raw/ftune_t0_apply.log"
          tail -6 "$OUT/raw/ftune_t0_apply.log" || true

      - name: FlowTune 目标 t=1（最小化网表深度）
        continue-on-error: true
        run: |
          cd official-flowtune/FlowTune-AIG-Optimization
          echo "ftune -d ${DESIGN} -r ${REPEAT} -t 1 -p 1 -i ${ITER} -s ${SAMPLE}" | ./abc \
            > "$OUT/raw/ftune_t1_search.log" 2>&1 || true
          FLOW="${DESIGN}.script"
          [ -f "$FLOW" ] || FLOW="$(ls -t *.script 2>/dev/null | head -1)"
          echo "流程文件：$FLOW"
          cp "$FLOW" "$OUT/raw/ftune_t1_best_flows.txt" 2>/dev/null || true
          head -1 "$FLOW" > chosen_t1.script 2>/dev/null || true
          echo "--- 选中的流程 ---"; cat chosen_t1.script || true
          timeout 900 ./abc -c "read ${DESIGN}; source chosen_t1.script; strash; print_stats; write flowtune_t1.aig" \
            > "$OUT/raw/ftune_t1_apply.log" 2>&1 || echo "应用超时" | tee -a "$OUT/raw/ftune_t1_apply.log"
          tail -6 "$OUT/raw/ftune_t1_apply.log" || true

      - name: 收集网表产物
        if: always()
        run: |
          cd official-flowtune/FlowTune-AIG-Optimization
          for f in baseline_resyn.aig baseline_resyn25.aig flowtune_t0.aig flowtune_t1.aig; do
            [ -f "$f" ] && cp "$f" "$OUT/netlists/" && echo "已收集 $f"
          done
          ls -l "$OUT/netlists" || true

      - name: 生成汇总报告
        if: always()
        run: |
          set +e
          stat_of () {
            sed -n 's/.*[^a-z]and = *\([0-9][0-9]*\).*lev = *\([0-9][0-9]*\).*/\1\t\2/p' "$1" | tail -1
          }
          row () {
            local name="$1" log="$2" size="$3"
            local v; v=$(stat_of "$log")
            printf '| %s | %s | %s | %s |\n' "$name" "${v%%$'\t'*}" "${v##*$'\t'}" "$size"
          }
          size_of () { [ -f "$1" ] && stat -c%s "$1" || echo "-"; }

          {
            echo "# FlowTune 论文复现结果（按高鹏老师要求）"
            echo
            echo "- 运行时间（UTC）：$(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- 运行环境：GitHub Actions ubuntu-latest，gcc $(gcc -dumpversion)"
            echo "- 作者代码：https://github.com/Yu-Maryland/FlowTune"
            echo "- 基准设计：\`${DESIGN}\`（论文用的六个 VTR 基准之一）"
            echo "- 参数：ftune \`-r ${REPEAT} -i ${ITER} -s ${SAMPLE}\`，t=0 优化门数，t=1 优化深度"
            echo "- 老师要求：① 得到逻辑综合的网表 ② 比较逻辑门数量和网表深度 ③ 先不用跑布线"
            echo
            echo "## 1. 结果对照表"
            echo
            echo "| 做法 | 逻辑门数量 (and) | 网表深度 (lev) | 网表文件大小 (字节) |"
            echo "|---|---|---|---|"
            row "基线一：ABC 默认 resyn"            "$OUT/raw/baseline_resyn.log"   "$(size_of "$OUT/netlists/baseline_resyn.aig")"
            row "基线二：resyn 连续 25 次"           "$OUT/raw/baseline_resyn25.log" "$(size_of "$OUT/netlists/baseline_resyn25.aig")"
            row "FlowTune（目标 t=0 最小化门数）"    "$OUT/raw/ftune_t0_apply.log"   "$(size_of "$OUT/netlists/flowtune_t0.aig")"
            row "FlowTune（目标 t=1 最小化深度）"    "$OUT/raw/ftune_t1_apply.log"   "$(size_of "$OUT/netlists/flowtune_t1.aig")"
            echo
            echo "说明：\`and\` 是 ABC 统计出的 AIG 与门节点数，代表逻辑门数量；\`lev\` 是逻辑级数，代表网表深度。两者都来自 ABC 的 \`print_stats\` 原始输出。"
            echo
            for pair in "基线一:baseline_resyn" "基线二:baseline_resyn25" "FlowTune-t0-search:ftune_t0_search" "FlowTune-t0-应用:ftune_t0_apply" "FlowTune-t1-search:ftune_t1_search" "FlowTune-t1-应用:ftune_t1_apply"; do
              label="${pair%%:*}"; file="${pair##*:}"
              echo "## 原始输出：${label}"
              echo '```'
              cat "$OUT/raw/${file}.log" 2>/dev/null || echo "(没有该文件)"
              echo '```'
              echo
            done
            echo "## FlowTune 搜索出的候选流程（原始）"
            echo '```'
            echo "--- t=0（最小化门数）---"
            cat "$OUT/raw/ftune_t0_best_flows.txt" 2>/dev/null || echo "(没有该文件)"
            echo "--- t=1（最小化深度）---"
            cat "$OUT/raw/ftune_t1_best_flows.txt" 2>/dev/null || echo "(没有该文件)"
            echo '```'
            echo
            echo "## 网表产物"
            echo '```'
            ls -l "$OUT/netlists" 2>/dev/null || echo "(没有网表)"
            echo '```'
          } > "$OUT/RESULTS.md"
          cat "$OUT/RESULTS.md"

      - name: 把结果提交回仓库
        if: always()
        run: |
          git config user.name "flowtune-runner"
          git config user.email "actions@users.noreply.github.com"
          git add flowtune-reproduction
          git commit -m "复现结果：FlowTune 网表 / 逻辑门数量 / 网表深度（云端自动生成）" || echo "没有变化"
          git push || echo "推送失败"
